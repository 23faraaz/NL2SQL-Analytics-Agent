[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6FA"
textColor = "#1E1E2E"
borderColor = "#E4E6F0"
linkColor = "#4F46E5"
codeBackgroundColor = "#F5F6FA"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseRadius = "0.75rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = false

[theme.sidebar]
backgroundColor = "#FAFAFC"
