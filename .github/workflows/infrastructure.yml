name: Production infrastructure

on:
  workflow_dispatch:
    inputs:
      image_uri:
        description: Initial CI-verified ECR image URI qualified by digest
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-infrastructure
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: terraform/environments/production
  TF_VAR_image_uri: ${{ inputs.image_uri }}
  TF_VAR_public_subnets: ${{ vars.TF_PRODUCTION_PUBLIC_SUBNETS }}
  TF_VAR_private_subnets: ${{ vars.TF_PRODUCTION_PRIVATE_SUBNETS }}
  TF_VAR_nat_gateway_subnet_key: ${{ vars.TF_PRODUCTION_NAT_GATEWAY_SUBNET_KEY }}
  TF_VAR_certificate_arn: ${{ vars.PRODUCTION_CERTIFICATE_ARN }}
  TF_VAR_application_secret_arn: ${{ vars.APPLICATION_SECRET_ARN }}
  TF_VAR_database_application_secret_arn: ${{ vars.DATABASE_APPLICATION_SECRET_ARN }}
  TF_VAR_github_production_subject: ${{ vars.PRODUCTION_OIDC_SUBJECT }}

jobs:
  plan:
    name: Review production infrastructure plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    outputs:
      destructive_changes: ${{ steps.review.outputs.destructive_changes }}

    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.9

      - name: Configure read-only planning credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: production-plan-${{ github.run_id }}

      - name: Initialize production backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: >-
          terraform init
          -lock-timeout=5m
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}"

      - name: Validate production configuration
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Create production plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -lock-timeout=5m -out=production.tfplan

      - name: Create review evidence
        id: review
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          terraform show -no-color production.tfplan > production-plan.txt
          terraform show -json production.tfplan > production-plan.json
          sha256sum production.tfplan > production.tfplan.sha256
          date -u +%s > production.tfplan.created_at

          creates="$(jq '[.resource_changes[]? | select(.change.actions == ["create"])] | length' production-plan.json)"
          updates="$(jq '[.resource_changes[]? | select(.change.actions == ["update"])] | length' production-plan.json)"
          deletes="$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' production-plan.json)"
          replacements="$(jq '[.resource_changes[]? | select((.change.actions | index("create")) and (.change.actions | index("delete")))] | length' production-plan.json)"
          destructive_changes=false
          if [[ "${deletes}" -gt 0 || "${replacements}" -gt 0 ]]; then
            destructive_changes=true
          fi
          echo "destructive_changes=${destructive_changes}" >> "${GITHUB_OUTPUT}"

          {
            echo "### Production Terraform plan"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image: \`${TF_VAR_image_uri}\`"
            echo "- Creates: **${creates}**"
            echo "- Updates: **${updates}**"
            echo "- Deletes: **${deletes}**"
            echo "- Replacements: **${replacements}**"
            if [[ "${destructive_changes}" == true ]]; then
              echo "> [!CAUTION]"
              echo "> This plan contains deletion or replacement actions. Review the text plan before approval."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload exact plan and review evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-plan-${{ github.sha }}
          path: |
            terraform/environments/production/production.tfplan
            terraform/environments/production/production.tfplan.sha256
            terraform/environments/production/production.tfplan.created_at
            terraform/environments/production/production-plan.txt
          if-no-files-found: error
          retention-days: 7

  apply:
    name: Approve and apply reviewed infrastructure
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Check out reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Download reviewed plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-plan-${{ github.sha }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Reject altered or stale plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check production.tfplan.sha256
          created_at="$(cat production.tfplan.created_at)"
          age_seconds="$(( $(date -u +%s) - created_at ))"
          if [[ "${age_seconds}" -gt 86400 ]]; then
            echo "Plan is older than 24 hours; create and review a new plan." >&2
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.9

      - name: Configure approved apply credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: production-apply-${{ github.run_id }}

      - name: Initialize production backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: >-
          terraform init
          -lock-timeout=5m
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}"

      - name: Apply only the reviewed plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -lock-timeout=5m -auto-approve production.tfplan

      - name: Record infrastructure outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "### Production infrastructure applied" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- ECS cluster: \`$(terraform output -raw ecs_cluster_name)\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- ECS service: \`$(terraform output -raw ecs_service_name)\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Application deploy role: \`$(terraform output -raw application_deploy_role_arn)\`" >> "${GITHUB_STEP_SUMMARY}"
