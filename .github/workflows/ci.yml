name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-format:
    name: Lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

      - name: Check Black formatting
        run: black --check .

  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -m "not integration" --strict-markers

  terraform:
    name: Terraform validation and security
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.9

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize and validate Terraform roots without remote backends
        shell: bash
        run: |
          set -euo pipefail
          for root in terraform/bootstrap terraform/global terraform/environments/staging terraform/environments/production; do
            echo "Validating ${root}"
            terraform -chdir="${root}" init -backend=false
            terraform -chdir="${root}" validate
          done

      - name: Scan Terraform for high and critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivy-version: v0.70.0

  container:
    name: Build and scan exact image
    needs:
      - lint-format
      - unit-tests
      - terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build traceable application image
        id: image
        uses: ./.github/actions/docker-build
        with:
          image-name: nl2sql-agent
          image-tag: sha-${{ github.sha }}
          platform: linux/amd64

      - name: Save Trivy audit report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image-ref }}
          version: v0.70.0
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: "0"

      - name: Enforce high and critical vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image-ref }}
          version: v0.70.0
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Upload Trivy audit report
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-results-${{ github.sha }}
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 30

      - name: Export the exact scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save --output nl2sql-agent.tar "${{ steps.image.outputs.image-ref }}"

      - name: Transfer exact image to trusted publishing job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scanned-image-${{ github.sha }}
          path: nl2sql-agent.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish immutable image to ECR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download exact scanned image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scanned-image-${{ github.sha }}

      - name: Load scanned image
        run: docker load --input nl2sql-agent.tar

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_CI_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: ci-publish-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@b040164c4934333d597f3f9c67502ff28f814e9c # v2.1.6

      - name: Publish or verify immutable commit image
        id: publish
        shell: bash
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY_NAME }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail

          local_ref="nl2sql-agent:${IMAGE_TAG}"
          remote_ref="${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"
          local_id="$(docker image inspect --format='{{.Id}}' "${local_ref}")"
          set +e
          existing_output="$(aws ecr describe-images \
            --repository-name "${REPOSITORY}" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>&1)"
          describe_status=$?
          set -e

          if [[ "${describe_status}" -eq 0 ]]; then
            existing_digest="${existing_output}"
          elif grep -q 'ImageNotFoundException' <<<"${existing_output}"; then
            existing_digest=""
          else
            printf '%s\n' "${existing_output}" >&2
            exit "${describe_status}"
          fi

          if [[ -n "${existing_digest}" && "${existing_digest}" != "None" ]]; then
            docker pull "${remote_ref}"
            existing_id="$(docker image inspect --format='{{.Id}}' "${remote_ref}")"

            if [[ "${local_id}" != "${existing_id}" ]]; then
              echo "Existing immutable tag does not match this build." >&2
              exit 1
            fi
          else
            docker tag "${local_ref}" "${remote_ref}"
            docker push "${remote_ref}"
          fi

          digest="$(aws ecr describe-images \
            --repository-name "${REPOSITORY}" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          image_uri="${REGISTRY}/${REPOSITORY}@${digest}"

          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "image-uri=${image_uri}" >> "${GITHUB_OUTPUT}"

      - name: Record registry-grade build metadata
        shell: bash
        run: |
          printf '%s\n' \
            "commit_sha=${GITHUB_SHA}" \
            "workflow_run_id=${GITHUB_RUN_ID}" \
            "image_digest=${{ steps.publish.outputs.digest }}" \
            "image_uri=${{ steps.publish.outputs.image-uri }}" \
            > build-metadata.txt
          {
            echo "### Published application image"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Digest: \`${{ steps.publish.outputs.digest }}\`"
            echo "- Deployable image: \`${{ steps.publish.outputs.image-uri }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload deployment metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-metadata-${{ github.sha }}
          path: build-metadata.txt
          if-no-files-found: error
          retention-days: 30
