services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nl2sql-net

  # Single explicit initialisation path: creates the commerce schema,
  # runs the real Olist ETL (S4a), runs synthetic augmentation (S4b),
  # then loads everything into commerce. Runs once per clean volume and
  # exits; app waits for it to finish successfully before starting.
  # Requires the real Olist dataset to be present in ./data/raw -- see
  # data/raw/README.md.
  db-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.etl
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ETL_AUGMENTATION_SEED: ${ETL_AUGMENTATION_SEED:-42}
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nl2sql-net
    restart: "no"

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8501:8501"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - nl2sql-net

networks:
  nl2sql-net:
    driver: bridge

volumes:
  db_data:
